server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: any unknown path falls back to index.html so React Router can handle it.
    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
    }
}
